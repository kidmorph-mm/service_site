services:
  db:
    image: mariadb:11.4
    container_name: kidmorph_db
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kidmorph}
      MYSQL_USER: ${MYSQL_USER:-kidmorph}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kidmorphpass}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # 외부 공개가 필요 없으면 로컬 바인딩(권장). 정말 완전 비공개면 ports 자체를 지워도 됩니다.
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  backend:
    build:
      context: ./backend
    container_name: kidmorph_backend
    restart: unless-stopped
    env_file: ./.env
    environment:
      TZ: Asia/Seoul
      # 컨테이너 내부 경로 기준으로 강제(호스트 경로 넣는 실수 방지)
      KIDMORPH_DATA_DIR: /data/jobs
      KIDMORPH_MODEL_ROOT: /runtime/models/smplx
      # DB URL도 컨테이너 네트워크 기준(db:3306)
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-kidmorph}:${MYSQL_PASSWORD:-kidmorphpass}@db:3306/${MYSQL_DATABASE:-kidmorph}?charset=utf8mb4
    volumes:
      - ./runtime/jobs:/data/jobs:rw
      - ./runtime/models:/runtime/models:ro
      - ./runtime/data:/runtime/data:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    gpus: all
    # Dockerfile에 CMD가 이미 있으면 이 command는 빼도 됩니다.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read(); print('ok')\""]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 20s

  worker:
    build:
      context: ./backend
    container_name: kidmorph_worker
    restart: unless-stopped
    env_file: ./.env
    environment:
      TZ: Asia/Seoul
      KIDMORPH_DATA_DIR: /data/jobs
      KIDMORPH_MODEL_ROOT: /runtime/models/smplx
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-kidmorph}:${MYSQL_PASSWORD:-kidmorphpass}@db:3306/${MYSQL_DATABASE:-kidmorph}?charset=utf8mb4
    command: ["python", "-m", "app.worker_loop"]
    volumes:
      - ./runtime/jobs:/data/jobs:rw
      - ./runtime/models:/runtime/models:ro
      - ./runtime/data:/runtime/data:ro
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    gpus: all

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: kidmorph_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

  adminer:
    image: adminer:4
    container_name: kidmorph_adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    # 필요할 때만 켜고 싶으면 아래 profiles 사용(기본 up 시 제외)
    profiles: ["tools"]

volumes:
  mariadb_data: